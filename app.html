<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manav Rachna University | International Collaborations</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{height:64px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:20px;padding:0 20px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;width:auto;flex:none}.logo img{height:54px;width:auto;display:block}.logo b{display:block;font-size:17px}.logo small{color:#64748b;font-size:11.5px}
.sb{flex:0 1 420px;display:flex;align-items:center;gap:10px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 14px;background:#fff;color:#64748b}
.sb input{border:0;outline:0;flex:1;font:inherit;background:none}.sp{flex:1}
.ib{position:relative;color:#333;display:flex}.ib em{position:absolute;top:-7px;right:-8px;background:#0d9488;color:#fff;font:600 10px/1 sans-serif;border-radius:9px;padding:3px 5px}
.ad{display:flex;align-items:center;gap:10px}.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0d9488,#5eead4);color:#fff;display:grid;place-items:center;font-weight:700}.ad b{display:block}.ad small{color:#64748b;font-size:12px}
.wrap{display:flex;align-items:flex-start}
aside{width:176px;flex:none;background:#fff;border-right:1px solid #e2e8f0;min-height:calc(100vh - 64px);padding:14px 8px;position:sticky;top:64px}
aside button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:9px;margin-bottom:6px;font-size:15px;line-height:1.2}
aside button:hover{background:#f0fdfa}aside button.on{background:#0d9488;color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:22px 18px 40px}.cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}
h1{margin:0;font-size:28px}.sub{color:#64748b;margin:2px 0 14px;font-size:14.5px}h3{margin:18px 0 10px;font-size:18px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{display:flex;gap:10px;align-items:center;padding:14px 12px;transition:.15s}.kpi:hover{border-color:#0d9488;box-shadow:0 3px 12px #0d948822;transform:translateY(-1px)}
.kpi small{display:block;font-size:11.5px;color:#333;font-weight:600}.kpi b{font-size:28px;line-height:1.1}.kpi b.t{font-size:19px;color:#0d9488}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.tile{cursor:pointer;text-align:center;padding:14px 4px;font-size:13px;font-weight:500;transition:.15s}.tile:hover{border-color:#0d9488;box-shadow:0 3px 10px #0d948822}
.ci{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px}.ci svg{width:26px;height:26px}
.two{display:grid;grid-template-columns:1.4fr 0.85fr;gap:12px;margin-top:14px}.card h4{margin:0;font-size:16px}.card p{margin:2px 0 6px;color:#64748b;font-size:12.5px}
.leg{display:flex;gap:16px;font-size:12px;margin-top:6px}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rh a{color:#0d9488;font-size:13px;display:flex;align-items:center;gap:2px;cursor:pointer}.rh a svg{width:15px;height:15px}
.rm{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #e2e8f0}.rm:first-of-type{border-top:0}.fl{font-size:24px;width:32px;text-align:center}.rm div{flex:1;min-width:0;font-size:13px}.rm small{display:block;color:#64748b}.rm span{color:#0d9488;font-size:13px;white-space:nowrap}
select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}.sch{font-size:12.5px;margin-top:8px;line-height:1.75}
.al{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:13px}.al small{display:block;color:#64748b}.right .card{margin-bottom:14px}
.tw{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:#64748b;font-size:12.5px;padding:9px 10px;border-bottom:1px solid #e2e8f0}td{padding:9px 10px;border-bottom:1px solid #e2e8f0;vertical-align:top}td small{display:block;color:#64748b}
.tl{display:flex;gap:10px;margin-bottom:12px}.tl input{flex:1;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
@media(max-width:1180px){.cols{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.wrap{flex-direction:column}aside{width:100%;min-height:0;display:flex;overflow:auto;position:static}aside button{width:auto;white-space:nowrap}.two{grid-template-columns:1fr}.sb,.ad div,.logo{width:auto}.kpis{grid-template-columns:repeat(2,1fr)}}

.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.green{background:#dcfce7;color:#166534}.badge.amber{background:#fef3c7;color:#92400e}.badge.blue{background:#ccfbf1;color:#1e40af}.badge.gray{background:#f3f4f6;color:#374151}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.kcol{background:#f8fafc;border-radius:10px;padding:10px;min-height:320px}
.kcol h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px;box-shadow:0 1px 2px #0001}
.kcard b{display:block;margin-bottom:4px}.kcard small{color:#64748b}

.map-marker:hover circle:first-child{fill:#0d4bb8;r:13}
.admin-drop{position:relative;cursor:pointer}
.admin-menu{display:none;position:absolute;right:0;top:48px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px #0002;min-width:180px;z-index:100;overflow:hidden}
.admin-menu.show{display:block}
.admin-menu a{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:14px;color:#0f172a;text-decoration:none;border-bottom:1px solid #f1f5f9}
.admin-menu a:last-child{border-bottom:0}
.admin-menu a:hover{background:#f0fdfa;color:#0d9488}
.upload-box{border:2px dashed #cbd5e1;border-radius:12px;padding:28px;text-align:center;background:#fafbfc;margin-bottom:16px;transition:.15s}
.upload-box:hover{border-color:#0d9488;background:#f0fdfa}
.upload-box input[type=file]{display:none}
.upload-box label{cursor:pointer;color:#0d9488;font-weight:600}

/* Vibrant Theme Overrides */
body{background:linear-gradient(160deg,#ecfdf5 0%,#f0f9ff 50%,#fff7ed 100%)!important;background-attachment:fixed}
header{background:rgba(255,255,255,0.92)!important;backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0}
aside{background:rgba(255,255,255,0.95)!important}
aside button.on{background:linear-gradient(135deg,#0d9488,#0891b2)!important;box-shadow:0 4px 14px rgba(13,148,136,0.35)}
.card{border-radius:14px!important;box-shadow:0 4px 16px rgba(15,23,42,0.06)!important;transition:transform .15s,box-shadow .15s}
.card:hover{box-shadow:0 8px 24px rgba(13,148,136,0.12)!important}
.kpi{border-radius:14px!important}
.kpi:hover{border-color:#0d9488!important;box-shadow:0 6px 20px rgba(13,148,136,0.18)!important}
.tile{border-radius:12px!important}
.tile:hover{border-color:#0d9488!important;box-shadow:0 4px 16px rgba(13,148,136,0.2)!important;transform:translateY(-2px)}
.av{background:linear-gradient(135deg,#0d9488,#f97316)!important}
.admin-menu a:hover{background:#ecfdf5!important;color:#0d9488!important}
.upload-box:hover{border-color:#0d9488!important;background:#ecfdf5!important}
.badge.green{background:#d1fae5;color:#065f46}
.badge.amber{background:#ffedd5;color:#9a3412}
.badge.blue{background:#ccfbf1;color:#0f766e}
.rh a{color:#0d9488!important}

/* ===== MULTI-COLOR VIBRANT SECTIONS ===== */

/* KPI cards - distinct colored left borders + soft backgrounds */
.kpis .kpi:nth-child(1){border-left:4px solid #2563eb;background:linear-gradient(135deg,#eff6ff,#fff)}
.kpis .kpi:nth-child(2){border-left:4px solid #8b5cf6;background:linear-gradient(135deg,#f5f3ff,#fff)}
.kpis .kpi:nth-child(3){border-left:4px solid #f97316;background:linear-gradient(135deg,#fff7ed,#fff)}
.kpis .kpi:nth-child(4){border-left:4px solid #10b981;background:linear-gradient(135deg,#ecfdf5,#fff)}
.kpis .kpi:nth-child(5){border-left:4px solid #ec4899;background:linear-gradient(135deg,#fdf2f8,#fff)}

/* Agreement tiles already colored via JS */

/* Map card - cyan accent */
.two .card:first-child{border-top:3px solid #06b6d4}
.two .card:first-child h4{color:#0891b2}

/* Bar chart card - indigo accent */
.two .card:last-child{border-top:3px solid #6366f1}
.two .card:last-child h4{color:#4f46e5}

/* Recent MoUs - emerald */
.right .card:nth-child(1){border-top:3px solid #10b981}
.right .card:nth-child(1) h4{color:#059669}

/* School filter - amber */
.right .card:nth-child(2){border-top:3px solid #f59e0b}
.right .card:nth-child(2) h4{color:#d97706}

/* Alerts - rose/red */
.right .card:nth-child(3){border-top:3px solid #f43f5e}
.right .card:nth-child(3) h4{color:#e11d48}

/* Sidebar active - gradient rainbow-ish teal to blue */
aside button.on{background:linear-gradient(135deg,#2563eb,#7c3aed)!important;box-shadow:0 4px 14px rgba(37,99,235,0.4)!important}

/* Header accent line */
header{border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#2563eb,#10b981,#f97316,#ec4899,#8b5cf6) 1}

/* Badge colors richer */
.badge.green{background:#d1fae5;color:#065f46}
.badge.amber{background:#fef3c7;color:#92400e}
.badge.blue{background:#dbeafe;color:#1e40af}
.badge.gray{background:#f1f5f9;color:#475569}

/* Kanban columns colors */
.kcol:nth-child(1){border-top:3px solid #3b82f6;background:#eff6ff}
.kcol:nth-child(2){border-top:3px solid #10b981;background:#ecfdf5}
.kcol:nth-child(3){border-top:3px solid #f59e0b;background:#fffbeb}
.kcol:nth-child(4){border-top:3px solid #94a3b8;background:#f8fafc}

/* Bottom stats bar */
main > div:last-child, .card:last-of-type{ }

/* Search bar focus */
.sb:focus-within{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,0.2)}

        localStorage.removeItem("mru_auth");

        window.location.href = "index.html";
      }

// Map custom tooltip (runs after each render)
function bindMapTooltips(){
  const tip = document.getElementById("mapTip");
  const svg = document.getElementById("worldMapSvg");
  if(!tip || !svg) return;
  svg.querySelectorAll(".map-marker").forEach(function(g){
    g.addEventListener("mouseenter", function(e){
      const label = g.getAttribute("data-label");
      const count = g.getAttribute("data-count");
      tip.innerHTML = label + ": <b>" + count + " partners</b>";
      tip.style.display = "block";
    });
    g.addEventListener("mousemove", function(e){
      const rect = svg.getBoundingClientRect();
      tip.style.left = (e.clientX - rect.left + 14) + "px";
      tip.style.top = (e.clientY - rect.top - 36) + "px";
    });
    g.addEventListener("mouseleave", function(){
      tip.style.display = "none";
    });
  });
}

// Hook into render to re-bind tooltips
const _origRender = typeof render === "function" ? render : null;
if(_origRender){
  window.render = function(){
    _origRender();
    setTimeout(bindMapTooltips, 50);
    // File input labels
    const f1 = document.getElementById("fileMoU");
    if(f1) f1.onchange = function(){ document.getElementById("fileMoUName").textContent = this.files[0] ? this.files[0].name : ""; };
    const f2 = document.getElementById("fileArr");
    if(f2) f2.onchange = function(){ document.getElementById("fileArrName").textContent = this.files[0] ? this.files[0].name : ""; };
    const b1 = document.getElementById("btnUploadMoU");
    if(b1) b1.onclick = function(){ alert("File upload received.\\n\\nIn the current demo version, data is embedded.\\nFor live updates, connect a backend (Firebase / university server).\\n\\nYour file name has been noted."); };
    const b2 = document.getElementById("btnUploadArr");
    if(b2) b2.onclick = function(){ alert("File upload received.\\n\\nIn the current demo version, data is embedded.\\nFor live updates, connect a backend (Firebase / university server)."); };
  };
}
// Initial bind after first render
setTimeout(bindMapTooltips, 300);
</script>

function latLonToVec3(lat, lon, radius){
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function destroyGlobe(){
  if(globeState.animId) cancelAnimationFrame(globeState.animId);
  if(globeState.renderer){
    try{ globeState.renderer.dispose(); }catch(e){}
    const el = document.getElementById("globeCanvas");
    if(el) el.innerHTML = "";
  }
  globeState = { scene:null, camera:null, renderer:null, earth:null, markers:[], animId:null, rotating:true, raycaster:null, mouse:null, container:null };
}

function initGlobe(){
  const box = document.getElementById("globeBox");
  const mount = document.getElementById("globeCanvas");
  const tip = document.getElementById("globeTip");
  if(!box || !mount || typeof THREE === "undefined") return;
  destroyGlobe();

  const w = box.clientWidth || 500;
  const h = box.clientHeight || 440;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 1000);
  camera.position.z = 3.15;

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.domElement.style.width = "100%";
  renderer.domElement.style.height = "100%";
  renderer.domElement.style.display = "block";
  mount.appendChild(renderer.domElement);

  // Keep canvas filling the box on resize
  if (window._globeRO) try{ window._globeRO.disconnect(); }catch(e){}
  window._globeRO = new ResizeObserver(()=>{
    const nw = box.clientWidth, nh = box.clientHeight;
    if(!nw || !nh) return;
    camera.aspect = nw/nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh, false);
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
  });
  window._globeRO.observe(box);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(5, 3, 5);
  scene.add(dir);
  const back = new THREE.DirectionalLight(0x60a5fa, 0.3);
  back.position.set(-3, -1, -2);
  scene.add(back);

  // Earth sphere
  const radius = 1;
  const earthGeo = new THREE.SphereGeometry(radius, 64, 64);
  // Procedural-ish earth: blue oceans + green land feel via vertex colors approximation
  // Use a simple material with earth-like color + slight emissive
  const earthMat = new THREE.MeshPhongMaterial({
    color: 0x1e40af,
    emissive: 0x0c4a6e,
    emissiveIntensity: 0.15,
    shininess: 12,
    transparent: false
  });
  // Load earth texture if online
  const loader = new THREE.TextureLoader();
  loader.load(
    "https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg",
    function(tex){
      earthMat.map = tex;
      earthMat.color = new THREE.Color(0xffffff);
      earthMat.emissive = new THREE.Color(0x000000);
      earthMat.needsUpdate = true;
    },
    undefined,
    function(){ /* offline fallback - solid blue already set */ }
  );
  const earth = new THREE.Mesh(earthGeo, earthMat);
  scene.add(earth);

  // Atmosphere glow
  const atmoGeo = new THREE.SphereGeometry(radius * 1.045, 48, 48);
  const atmoMat = new THREE.MeshBasicMaterial({
    color: 0x38bdf8,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide
  });
  scene.add(new THREE.Mesh(atmoGeo, atmoMat));

  // Stars background
  const starsGeo = new THREE.BufferGeometry();
  const starPos = [];
  for(let i=0;i<600;i++){
    const r = 4 + Math.random()*3;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    starPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  }
  starsGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.02, transparent:true, opacity:0.8 })));

  // Markers
  const markers = [];
  const markerGroup = new THREE.Group();
  earth.add(markerGroup);

  GLOBE_MARKERS.forEach(function(m){
    const pos = latLonToVec3(m.lat, m.lon, radius * 1.02);
    const size = m.isHome ? 0.045 : 0.032;
    const geo = new THREE.SphereGeometry(size, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: m.color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    mesh.userData = m;
    markerGroup.add(mesh);

    // Glow ring for home
    if(m.isHome){
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.05, 0.07, 24),
        new THREE.MeshBasicMaterial({ color:0xef4444, side:THREE.DoubleSide, transparent:true, opacity:0.7 })
      );
      ring.position.copy(pos);
      ring.lookAt(0,0,0);
      markerGroup.add(ring);
    }
    // Outer soft glow
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(size*1.8, 12, 12),
      new THREE.MeshBasicMaterial({ color:m.color, transparent:true, opacity:0.25 })
    );
    glow.position.copy(pos);
    markerGroup.add(glow);

    markers.push(mesh);
  });

  // Interaction
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let isDragging = false, prevX = 0;

  function onPointerMove(e){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(markers);
    if(hits.length > 0){
      globeState.rotating = false;
      const m = hits[0].object.userData;
      if(m.isHome){
        tip.innerHTML = "<b>🇮🇳 India</b><small>"+m.detail.replace(/\\n/g,"<br>")+"</small><br><span style='color:#fbbf24'>Home Campus</span>";
      } else {
        tip.innerHTML = "<b>"+m.name+"</b>"+m.count+" partner universit"+(m.count===1?"y":"ies");
      }
      tip.style.display = "block";
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 180) + "px";
      tip.style.top = Math.max(8, e.clientY - rect.top - 50) + "px";
      document.body.style.cursor = "pointer";
    } else {
      tip.style.display = "none";
      if(!isDragging) globeState.rotating = true;
      document.body.style.cursor = "default";
    }

    if(isDragging){
      const dx = e.clientX - prevX;
      earth.rotation.y += dx * 0.005;
      prevX = e.clientX;
    }
  }

  function onPointerDown(e){ isDragging = true; prevX = e.clientX; globeState.rotating = false; }
  function onPointerUp(){ isDragging = false; globeState.rotating = true; tip.style.display = "none"; }

  renderer.domElement.addEventListener("pointermove", onPointerMove);
  renderer.domElement.addEventListener("pointerdown", onPointerDown);
  renderer.domElement.addEventListener("pointerup", onPointerUp);
  renderer.domElement.addEventListener("pointerleave", function(){ isDragging=false; globeState.rotating=true; tip.style.display="none"; });

  // Animate
  function animate(){
    globeState.animId = requestAnimationFrame(animate);
    if(globeState.rotating){
      earth.rotation.y += 0.0035;
    }
    renderer.render(scene, camera);
  }

  globeState = { scene, camera, renderer, earth, markers, animId:null, rotating:true, raycaster, mouse, container:box };
  animate();
}


window.addEventListener("load", function(){
  setTimeout(function(){ if(typeof view!=="undefined" && view==="dash" && typeof initGlobe==="function"){ try{initGlobe();}catch(e){console.warn("Globe:",e);} } }, 400);
});
// Re-init when navigating back to dashboard
document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-v]");
  if(btn && btn.getAttribute("data-v")==="dash"){
    setTimeout(function(){ if(typeof initGlobe==="function") try{initGlobe();}catch(err){} }, 150);
  }
});

</script>
